name: pr-title

# Squash merges use the PR title as the commit subject on main, so the title decides the
# release. Kept apart from pr.yml so editing a title does not rebuild the installers.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release/lint-title.mjs
