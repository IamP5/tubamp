name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The preview builds the squash outcome when it releases, else the merge-commit outcome.
    outputs:
      release: ${{ steps.plan.outputs.release == 'true' || steps.plan.outputs.squash_release == 'true' }}
      squash: ${{ steps.plan.outputs.squash_release == 'true' }}
      squash_title: ${{ steps.plan.outputs.squash_title }}
      build_version: ${{ steps.plan.outputs.squash_release == 'true' && steps.plan.outputs.squash_build_version || steps.plan.outputs.build_version }}
      sha: ${{ steps.plan.outputs.sha }}
      updates: ${{ steps.plan.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test the release scripts
        run: node --test 'scripts/release/test/*.test.mjs'

      # A squash merge of a single commit keeps that commit's subject, not the PR title.
      # A pull request never sees the release secret, so the dry run decides updates from
      # the committed keys alone and signs with a throwaway key.
      - name: Plan (dry run)
        id: plan
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          title="$PR_TITLE"
          if [ "$PR_COMMITS" = 1 ]; then title="$(git log -1 --format=%s HEAD^2)"; fi
          printf 'squash_title=%s\n' "$title" >> "$GITHUB_OUTPUT"
          node scripts/release/plan.mjs --signing-key throwaway --summary-label 'Merged as a merge commit'
          node scripts/release/plan.mjs --signing-key throwaway --squash-title "$title" --summary-label "Squashed with this title: $title"

  build:
    needs: plan
    uses: ./.github/workflows/installers.yml
    with:
      version: ${{ needs.plan.outputs.build_version }}
      updates: ${{ needs.plan.outputs.updates }}
      archive: true

  # The same steps as release.yml's publish job, on the same runner, with a throwaway
  # signing key and publish.mjs --dry-run.
  release-preview:
    needs: [plan, build]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.build_version }}
      SHA: ${{ needs.plan.outputs.sha }}
      SQUASH: ${{ needs.plan.outputs.squash }}
      SQUASH_TITLE: ${{ needs.plan.outputs.squash_title }}
      UPDATES: ${{ needs.plan.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-archive

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: component-*
          path: components
          merge-multiple: true

      - name: Release notes and manifest
        run: |
          squash=()
          if [ "$SQUASH" = true ]; then squash=(--squash-title "$SQUASH_TITLE"); fi
          node scripts/release/notes.mjs "${squash[@]}" --out dist/notes.md
          node scripts/release/manifest.mjs --version "$VERSION" --dir dist --notes-file dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      # With updates off, the archive and envelope go to preview/, so the publish dry run
      # sees exactly what an off release would publish.
      - name: Sign a test envelope and check it with the client's code
        run: |
          out=dist
          if [ "$UPDATES" != on ]; then
            out=preview
            mkdir -p preview
            mv "dist/tubamp-$VERSION-macos-universal.zip" preview/
            cp dist/*.build.json preview/
          fi
          openssl="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          [ -x "$openssl" ] || { brew install openssl@3 && openssl="$(brew --prefix openssl@3)/bin/openssl"; }
          scratch="$(mktemp -d)"
          (umask 077 && "$openssl" ecparam -name prime256v1 -genkey -noout -out "$scratch/key.pem")
          "$openssl" ec -in "$scratch/key.pem" -pubout -out "$scratch/key.pub.pem" 2>/dev/null
          TUBAMP_UPDATE_SIGNING_KEYS="$(cat "$scratch/key.pem")" OPENSSL="$openssl" \
            node scripts/release/envelope.mjs --version "$VERSION" --dir "$out"
          rm "$scratch/key.pem"
          for arch in arm64 x86_64; do mkdir -p "components/$arch" && tar -C "components/$arch" -xf "components/component-$arch.tar"; done
          chmod +x build/tool/tubamp_update_tool
          build/tool/tubamp_update_tool verify-envelope --envelope "$out/update-v1.signed" --running 0.0.0 \
            --trust "$scratch/key.pub.pem" --archive "$out/tubamp-$VERSION-macos-universal.zip" \
            --installed components/arm64/tubamp.component --installed components/x86_64/tubamp.component
          echo "Updates **$UPDATES** in this preview. The update archive and a test envelope signed with a throwaway key passed the client's checks." >> "$GITHUB_STEP_SUMMARY"

      # Only a PR that releases, merged either way, has a version whose tag must not exist yet.
      - name: Publish (dry run)
        if: needs.plan.outputs.release == 'true'
        run: node scripts/release/publish.mjs --dry-run --version "$VERSION" --sha "$SHA" --dir dist --notes-file dist/notes.md --updates "$UPDATES"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          path: |
            dist/manifest.json
            dist/SHA256SUMS
            dist/notes.md
          if-no-files-found: error

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
