name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      build_version: ${{ steps.plan.outputs.build_version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test the release scripts
        run: node --test 'scripts/release/test/*.test.mjs'

      - name: Plan (dry run)
        id: plan
        run: node scripts/release/plan.mjs

  build:
    needs: plan
    uses: ./.github/workflows/installers.yml
    with:
      version: ${{ needs.plan.outputs.build_version }}

  release-preview:
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.build_version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Release notes and manifest
        run: |
          node scripts/release/notes.mjs --out dist/notes.md
          node scripts/release/manifest.mjs --version "$VERSION" --dir dist --notes-file dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"

      # Only a releasing PR has a version whose tag must not exist yet.
      - name: Publish (dry run)
        if: needs.plan.outputs.release == 'true'
        run: node scripts/release/publish.mjs --dry-run --version "$VERSION" --sha "$SHA" --dir dist --notes-file dist/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          path: |
            dist/manifest.json
            dist/SHA256SUMS
            dist/notes.md
          if-no-files-found: error

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
