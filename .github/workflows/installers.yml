name: installers

on:
  workflow_call:
    inputs:
      version:
        description: Version baked into the plugin and the installers, X.Y.Z
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    name: installer (${{ matrix.arch }})
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Rosetta for the x86_64 smoke test
        if: matrix.arch == 'x86_64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Build, test and package
        run: scripts/release/build-installer.sh "$ARCH" "$VERSION"

      - name: Install the package and validate the AU
        if: matrix.arch == 'arm64'
        run: |
          sudo installer -pkg "dist/tubamp-$VERSION-macos-arm64.pkg" -target /
          test -f /Library/Audio/Plug-Ins/Components/tubamp.component/Contents/MacOS/tubamp
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Tamp Tuba

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}
          path: |
            dist/tubamp-${{ inputs.version }}-macos-${{ matrix.arch }}.pkg
            dist/tubamp-${{ inputs.version }}-macos-${{ matrix.arch }}.build.json
          if-no-files-found: error
