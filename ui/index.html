<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1120, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>tubamp</title>
    <!-- Inline favicon: the resource provider serves no /favicon.ico, and a
         404 in the WebView console is pure noise. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23ff7a1a'/%3E%3C/svg%3E"
    />
    <style>
      /* Inline so the WebView never flashes white before the CSS bundle lands. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #e6eaf0;
      }
    </style>
    <script>
      // Right-click inside a plugin WebView can hand a native context menu to
      // the host (Logic crash risk, see docs/REACT-UI.md) — kill it as early as
      // possible, before React mounts. Same for text selection drags, the
      // rubber-band overscroll and the browser's own zoom gestures.
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });
      document.addEventListener(
        "dragstart",
        function (e) {
          e.preventDefault();
        },
        { capture: true },
      );
      document.addEventListener(
        "gesturestart",
        function (e) {
          e.preventDefault();
        },
        { capture: true },
      );
      document.addEventListener(
        "wheel",
        function (e) {
          // Block pinch-zoom of the whole document; the board handles its own
          // ctrl+wheel zoom on its stage element and stops propagation there.
          if (e.ctrlKey) e.preventDefault();
        },
        { passive: false, capture: true },
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
